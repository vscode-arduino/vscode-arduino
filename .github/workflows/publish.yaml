name: Publish extension 

on:
  release:
   types: [published]
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:
  call-build:
    uses: ./.github/workflows/build.yml
    with:
      BUILD_FLAGS: ${{ case(github.event_name == 'release', '', '--pre-release') }}
      os: '["ubuntu-latest"]'

  publish:
    permissions: 
      id-token: write
    needs: call-build
    runs-on: ubuntu-latest
    steps:       
      - name: download-artifacts
        uses: actions/download-artifact@v4
        with:
          name: VS Code extension VSIXes (ubuntu-latest)
          path: ${{ github.workspace }}/out/vsix/

      - name: Use Node 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: install vsce
        run: npm install @vscode/vsce

      - name: publish extension
        if: ${{ github.event_name == 'release' }}
        run: npx @vscode/vsce publish --oidc --packagePath ./out/vsix/*

      - name: publish pre-release
        if: ${{ github.event_name != 'release' }}
        run: npx @vscode/vsce publish --oidc --pre-release --packagePath ./out/vsix/* patch
      




